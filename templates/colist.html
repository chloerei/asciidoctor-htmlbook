<ul {% if node.id %}id="{{ node.id }}"{% endif %} data-type="colist">
  {% for item in node.items %}
    <li>
      {% assign coids = item.attributes.coids | split: ' ' %}
      {% for coid in coids %}
        <a data-type="callout" id="colist-{{ coid }}" href="#callout-{{ coid }}">{{ coid | split: '-' | last }}</a>
      {% endfor %}
      {{ item.text }}
    </li>
  {% endfor %}
</ul>
